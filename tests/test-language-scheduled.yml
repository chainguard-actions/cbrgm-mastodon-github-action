name: Test language and scheduled-at options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Compute scheduled time (10 minutes from now)
        id: schedule
        run: |
          # Compute a time 10 minutes in the future in ISO 8601 format
          SCHEDULED=$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                      date -u -v+10M '+%Y-%m-%dT%H:%M:%SZ')
          echo "scheduled_at=$SCHEDULED" >> "$GITHUB_OUTPUT"
          echo "Scheduled at: $SCHEDULED"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Scheduled toot in German'
          visibility: 'public'
          language: 'de'
          scheduled-at: ${{ steps.schedule.outputs.scheduled_at }}

      - name: Assert action was invoked with language and scheduled-at options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid
          # This confirms the action was properly invoked with language/scheduled-at options
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid credentials (expected behavior)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test visibility options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unlisted visibility
        id: action-unlisted
        uses: .
        with:
          url: 'https://mastodon.social'
          access-token: 'fake-token-for-testing'
          message: 'Test unlisted toot'
          visibility: 'unlisted'
        continue-on-error: true

      - name: Assert unlisted visibility action ran
        env:
          OUTCOME: ${{ steps.action-unlisted.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with unlisted visibility (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Run action with direct visibility
        id: action-direct
        uses: .
        with:
          url: 'https://mastodon.social'
          access-token: 'fake-token-for-testing'
          message: 'Test direct toot'
          visibility: 'direct'
        continue-on-error: true

      - name: Assert direct visibility action ran
        env:
          OUTCOME: ${{ steps.action-direct.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with direct visibility (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Run action with private visibility
        id: action-private
        uses: .
        with:
          url: 'https://mastodon.social'
          access-token: 'fake-token-for-testing'
          message: 'Test private toot'
          visibility: 'private'
        continue-on-error: true

      - name: Assert private visibility action ran
        env:
          OUTCOME: ${{ steps.action-private.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with private visibility (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

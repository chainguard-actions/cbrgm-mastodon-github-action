name: Test mastodon-send with media and scheduled inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy image file to pass as media-paths
      - name: Create dummy media file
        run: |
          dd if=/dev/urandom bs=1024 count=1 2>/dev/null | base64 > /tmp/test-image.png
          echo "Created dummy media file at /tmp/test-image.png"

      # Test that the action accepts media-paths, media-descriptions, and scheduled-at
      # inputs without crashing on argument parsing. With invalid credentials the
      # action will fail at the API call stage, not at input validation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.invalid'
          access-token: 'fake-token-for-testing'
          message: 'Test toot with media and scheduled inputs'
          visibility: 'public'
          media-paths: '/tmp/test-image.png'
          media-descriptions: 'A test image for CI'
          scheduled-at: '2099-01-01T00:00:00Z'

      - name: Assert action was invoked with media and scheduled inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it was never invoked"
            exit 1
          fi
          # Failure is expected because credentials are fake
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at API call stage (not at input parsing) as expected"
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          fi

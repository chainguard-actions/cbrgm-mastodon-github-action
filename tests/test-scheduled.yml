name: Test scheduled-at input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute scheduled-at (5 minutes from now)
        id: schedule
        run: |
          # Compute a datetime at least 5 minutes in the future in ISO 8601 format
          SCHEDULED="$(date -u -d '+6 minutes' '+%Y-%m-%dT%H:%M:%S.000Z' 2>/dev/null || date -u -v+6M '+%Y-%m-%dT%H:%M:%S.000Z')"
          echo "scheduled_at=$SCHEDULED" >> "$GITHUB_OUTPUT"
          echo "Scheduled at: $SCHEDULED"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: ${{ secrets.MASTODON_URL || 'https://mastodon.social' }}
          access-token: ${{ secrets.MASTODON_ACCESS_TOKEN || 'test-token' }}
          message: 'Scheduled test toot from GitHub Actions'
          visibility: 'public'
          language: 'en'
          scheduled-at: ${{ steps.schedule.outputs.scheduled_at }}

      - name: Assert scheduled-at input was accepted or action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCHEDULED_AT_OUT: ${{ steps.action.outputs.scheduled_at }}
        run: |
          echo "Action outcome: $OUTCOME"
          echo "scheduled_at output: $SCHEDULED_AT_OUT"
          # The action either succeeded (real credentials) or failed with auth error
          # Either way, the scheduled-at input was exercised
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with scheduled-at input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with scheduled-at input (failed due to missing credentials, which is expected in test environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test visibility options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Test toot with unlisted visibility'
          visibility: 'unlisted'

      - name: Assert action was invoked with unlisted visibility
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid
          # This confirms the action was properly invoked with the unlisted visibility option
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid credentials (expected behavior)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - id: action-direct
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Test toot with direct visibility'
          visibility: 'direct'

      - name: Assert action was invoked with direct visibility
        env:
          OUTCOME: ${{ steps.action-direct.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid credentials (expected behavior)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

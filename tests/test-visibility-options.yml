name: Test visibility options error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-unlisted
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Test unlisted toot'
          visibility: 'unlisted'

      - name: Assert unlisted visibility action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action-unlisted.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with unlisted visibility correctly failed with invalid credentials"

      - id: action-private
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Test private toot'
          visibility: 'private'

      - name: Assert private visibility action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action-private.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with private visibility correctly failed with invalid credentials"

name: Test basic usage - invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        with:
          url: 'https://mastodon.social'
          access-token: 'fake-token-for-testing'
          message: 'Test toot from GitHub Actions CI'
          visibility: 'public'
        continue-on-error: true
      - name: Assert action attempted to run (failed with auth error, not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (invalid credentials), but it should have
          # attempted to connect - not fail due to misconfiguration.
          # A 'failure' outcome means the Docker container ran and the binary
          # returned a non-zero exit code (auth error), which is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded - this may indicate a real token was used"
            echo "PASS"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' - action may not have run at all"
            exit 1
          fi

name: Test basic usage - send toot with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a real Mastodon instance and access token.
      # Under act/CI we use a fake URL and token to verify the action
      # is invoked correctly and passes inputs through to the Docker container.
      # The action is expected to fail with a network/auth error (exit non-zero),
      # NOT with a missing-input or argument-parsing error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.example.invalid'
          access-token: 'fake-token-for-testing'
          message: 'Hello from GitHub Actions test!'
          visibility: 'public'

      - name: Assert action was invoked (not a config/arg error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should have run (either succeeded or failed due to network/auth).
          # If outcome is 'skipped', something went wrong with invocation itself.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"

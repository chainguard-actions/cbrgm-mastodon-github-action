name: Test scheduled toot (scheduled-at input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute a scheduled-at time 10 minutes in the future
        id: schedule
        run: |
          FUTURE=$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                   date -u -v+10M '+%Y-%m-%dT%H:%M:%SZ')
          echo "time=$FUTURE" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Scheduled test toot from GitHub Actions'
          visibility: 'public'
          scheduled-at: ${{ steps.schedule.outputs.time }}
      - name: Assert action ran (invalid credentials expected to fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with scheduled-at input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

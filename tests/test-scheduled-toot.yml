name: Test scheduled toot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute scheduled time (10 minutes from now)
        id: schedule
        run: |
          SCHEDULED=$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%S.000Z' 2>/dev/null \
            || date -u -v+10M '+%Y-%m-%dT%H:%M:%S.000Z')
          echo "at=$SCHEDULED" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Scheduled test toot from GitHub Actions CI'
          visibility: 'public'
          scheduled-at: ${{ steps.schedule.outputs.at }}
      - name: Assert action ran (expected failure due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with scheduled-at input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

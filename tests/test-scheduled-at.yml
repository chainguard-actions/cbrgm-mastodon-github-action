name: Test scheduled-at input
# This test verifies the action accepts the scheduled-at input and fails
# gracefully with invalid credentials. The scheduled-at value must be at
# least 5 minutes in the future per the Mastodon API requirement.
# We cannot test a successful scheduled post without a real Mastodon instance.
on:
  workflow_dispatch:

jobs:
  test-scheduled-at:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute a scheduled-at time 10 minutes in the future
        id: schedule
        run: |
          SCHEDULED_AT=$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%S.000Z' 2>/dev/null \
            || date -u -v+10M '+%Y-%m-%dT%H:%M:%S.000Z')
          echo "scheduled_at=$SCHEDULED_AT" >> "$GITHUB_OUTPUT"
          echo "Scheduled at: $SCHEDULED_AT"

      - name: Run action with scheduled-at and invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Test scheduled toot from GitHub Actions CI'
          visibility: 'public'
          scheduled-at: ${{ steps.schedule.outputs.scheduled_at }}

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials even when scheduled-at is provided"

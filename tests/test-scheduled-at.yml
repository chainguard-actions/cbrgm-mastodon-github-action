name: Test scheduled-at input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'invalid-token-for-testing'
          message: 'Test scheduled toot from GitHub Actions'
          visibility: 'public'
          scheduled-at: '2099-12-31T23:59:00.000Z'
      - name: Assert action ran with scheduled-at input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail due to invalid credentials,
          # but we verify it ran (not skipped) and the input was accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with scheduled-at input (outcome: $OUTCOME)"

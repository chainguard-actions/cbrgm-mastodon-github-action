name: Test visibility and language options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.social'
          access-token: 'fake-token-for-testing'
          message: 'Test toot with unlisted visibility and English language'
          visibility: 'unlisted'
          language: 'en'
      - name: Assert action ran and failed gracefully (invalid credentials expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOOT_ID: ${{ steps.action.outputs.id }}
          TOOT_URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "toot id: $TOOT_ID"
          echo "toot url: $TOOT_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOOT_ID" ]; then
              echo "FAIL: action succeeded but toot id output is empty"
              exit 1
            fi
            echo "PASS: toot posted with unlisted visibility, id '$TOOT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid credentials as expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

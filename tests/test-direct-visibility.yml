name: Test direct visibility and unreachable instance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with direct visibility and unreachable instance (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://this-mastodon-instance-does-not-exist.invalid'
          access-token: 'invalid-token-for-testing'
          message: 'Direct message test'
          visibility: 'direct'

      - name: Assert action failed with unreachable instance
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable instance, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with unreachable instance"

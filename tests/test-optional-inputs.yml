name: Test mastodon-send with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts all optional inputs without crashing on
      # argument parsing. With invalid credentials the action will fail at the
      # API call stage, not at input validation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.invalid'
          access-token: 'fake-token-for-testing'
          message: 'Test toot with optional inputs'
          visibility: 'unlisted'
          sensitive: 'true'
          spoiler-text: 'CW: test content warning'
          language: 'en'

      - name: Assert action was invoked with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it was never invoked"
            exit 1
          fi
          # Failure is expected because credentials are fake
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at API call stage (not at input parsing) as expected"
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          fi

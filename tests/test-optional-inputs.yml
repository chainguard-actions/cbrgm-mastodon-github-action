name: Test optional inputs - visibility, sensitive, language, spoiler-text
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that optional inputs are accepted and passed through correctly.
      # The action will fail due to invalid URL/token, but we verify it
      # was invoked without argument-parsing errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://mastodon.example.invalid'
          access-token: 'fake-token-for-testing'
          message: 'Test toot with optional inputs'
          visibility: 'unlisted'
          sensitive: 'true'
          spoiler-text: 'Content warning: test'
          language: 'en'

      - name: Assert action was invoked with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with optional inputs (outcome=$OUTCOME)"
